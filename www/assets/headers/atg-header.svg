<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 85" width="1200" height="85">
  <!-- Background -->
  <rect width="1200" height="85" fill="#ffffff"/>

  <!-- LEFT TEXT: ABDULMAJEED ALWAHBANI GROUP (ATG) -->
  <g transform="translate(35, 52)">
    <text x="0" y="0" font-family="'Cinzel', 'Trajan Pro', 'Cairo', 'Georgia', serif" font-size="25" font-weight="900" fill="#dc2626" letter-spacing="2.5">ABDULMAJEED ALWAHBANI GROUP (ATG)</text>
    <!-- Characteristic horizontal decorative cross-bars in letters -->
    <line x1="2" y1="-10" x2="495" y2="-10" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- CENTER MONOGRAM & ATG WORDMARK -->
  <g transform="translate(535, 14)">
    <!-- Interlocking Monogram A-T-G -->
    <g transform="translate(0, 0)">
      <!-- Red A -->
      <path d="M 16,56 L 6,18 Q 4,12 12,12 Q 20,12 18,18 L 18,56" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="8" y1="36" x2="22" y2="36" stroke="#dc2626" stroke-width="3"/>
      
      <!-- Green T -->
      <path d="M 12,12 L 38,12" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 25,12 L 25,56" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Blue G Loop (Descends below baseline) -->
      <path d="M 40,26 C 44,18 20,14 12,32 C 6,48 20,66 38,62 C 48,58 48,46 36,46 L 24,46" fill="none" stroke="#000080" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Bold Italic ATG Wordmark -->
    <g transform="translate(54, 38) skewX(-12)">
      <text x="0" y="14" font-family="'Arial Black', 'Impact', sans-serif" font-size="38" font-weight="900" fill="#000080" letter-spacing="-1">ATG</text>
    </g>
  </g>

  <!-- RIGHT TEXT: مجموعة عبد المجيد الوهباني للتجارة -->
  <g transform="translate(685, 52)">
    <text x="475" y="0" text-anchor="end" font-family="'Cairo', 'Amiri', 'Tajawal', sans-serif" font-size="31" font-weight="900" fill="#dc2626" letter-spacing="0">مجموعة عبد المجيد الوهباني للتجارة</text>
  </g>

  <!-- BOTTOM TWO-TONE SPLIT SEPARATOR -->
  <!-- Left Red Bar -->
  <rect x="35" y="66" width="500" height="4" fill="#dc2626" rx="2"/>
  
  <!-- Right Dark Blue Bar -->
  <rect x="545" y="66" width="620" height="4" fill="#000080" rx="2"/>
</svg>
