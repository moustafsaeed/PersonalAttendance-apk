<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100">
  <!-- Background -->
  <rect width="1200" height="100" fill="#ffffff"/>

  <!-- LEFT LOGO: Green energy center -->
  <g transform="translate(45, 12)">
    <!-- Arabic Subtitle + Leaf -->
    <g transform="translate(68, 6)">
      <!-- Leaf icon -->
      <path d="M-18,6 C-24,-4 -8,-7 0,-3 C-4,4 -10,7 -18,6 Z" fill="#84cc16"/>
      <path d="M-14,3 Q-8,0 -2,-2" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <!-- Text: مركز الطاقة الخضراء -->
      <text x="5" y="0" font-family="'Cairo', 'Tajawal', sans-serif" font-size="11.5" font-weight="800" fill="#84cc16" letter-spacing="0.5">مركز الطاقة الخضراء</text>
    </g>

    <!-- Word: Green -->
    <g transform="translate(0, 10)">
      <!-- Stylized 'G' with leaf -->
      <path d="M 28,16 C 18,12 8,20 8,30 C 8,40 18,48 28,45 C 36,42 38,36 38,30 L 26,30" fill="none" stroke="#84cc16" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Leaf on G -->
      <path d="M 16,14 C 10,2 26,-2 32,4 C 28,12 22,16 16,14 Z" fill="#84cc16"/>
      <path d="M 20,11 Q 25,7 30,5" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      <!-- 'reen' -->
      <text x="44" y="38" font-family="'Montserrat', 'Arial Rounded MT Bold', sans-serif" font-size="34" font-weight="700" fill="#84cc16" letter-spacing="-1">reen</text>
    </g>

    <!-- Word: energy -->
    <g transform="translate(8, 44)">
      <text x="0" y="24" font-family="'Montserrat', 'Arial Rounded MT Bold', sans-serif" font-size="30" font-weight="600" fill="#84cc16" letter-spacing="-0.5">energy</text>
    </g>

    <!-- Word: c e n t e r -->
    <g transform="translate(14, 76)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Rounded MT Bold', sans-serif" font-size="9" font-weight="700" fill="#84cc16" letter-spacing="11">center</text>
    </g>
  </g>

  <!-- RIGHT LOGO: مركز الطاقة الخضراء (Stylized Tall Rounded Kufic) -->
  <g transform="translate(850, 10)">
    <!-- Top Word: مركز -->
    <g transform="translate(100, 14)">
      <path d="M 0,0 C 8,-6 24,-6 32,0 C 24,6 8,6 0,0 Z" fill="#16a34a"/>
      <circle cx="16" cy="-8" r="3.5" fill="#16a34a"/>
      <circle cx="26" cy="-8" r="3.5" fill="#16a34a"/>
      <path d="M 6,-2 L 6,10 Q 6,14 12,14 L 38,14" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22,2 Q 32,2 38,8" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Main Stylized Arched Text: الطاقة الخضراء -->
    <g transform="translate(0, 18)">
      <!-- Leaf on top of الخضراء -->
      <g transform="translate(36, 12)">
        <path d="M 0,10 C -8,-2 8,-8 16,-2 C 12,8 6,12 0,10 Z" fill="#16a34a"/>
        <path d="M 3,6 Q 8,2 14,0" stroke="#ffffff" stroke-width="0.8" fill="none"/>
      </g>

      <!-- Word: الخضراء (Right to Left) -->
      <!-- ء -->
      <g transform="translate(0, 42)">
        <path d="M 2,16 Q 10,6 18,12 Q 10,16 6,24 L 20,24" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <!-- راء -->
      <g transform="translate(20, 20)">
        <path d="M 12,46 L 12,16 Q 12,8 20,8 Q 28,8 28,16 L 28,46" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <!-- ض -->
      <g transform="translate(56, 14)">
        <path d="M 8,52 L 8,14 Q 8,6 18,6 Q 28,6 28,14 L 28,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="18" cy="-2" r="3" fill="#16a34a"/>
      </g>
      <!-- خـ/الـ -->
      <g transform="translate(92, 14)">
        <path d="M 8,52 L 8,14 Q 8,6 18,6 Q 28,6 28,14 L 28,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 36,52 L 36,14 Q 36,6 46,6 Q 56,6 56,14 L 56,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      <!-- Space / Dot elements -->
      <!-- Word: الطاقة -->
      <!-- ة -->
      <g transform="translate(160, 24)">
        <circle cx="12" cy="12" r="2.5" fill="#16a34a"/>
        <circle cx="20" cy="12" r="2.5" fill="#16a34a"/>
        <path d="M 6,42 L 6,22 Q 6,16 16,16 Q 26,16 26,22 L 26,42" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <!-- قـ -->
      <g transform="translate(196, 22)">
        <circle cx="14" cy="8" r="2.5" fill="#16a34a"/>
        <circle cx="22" cy="8" r="2.5" fill="#16a34a"/>
        <path d="M 8,44 L 8,18 Q 8,12 18,12 Q 28,12 28,18 L 28,44" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <!-- طا -->
      <g transform="translate(232, 14)">
        <path d="M 8,52 L 8,14 Q 8,6 18,6 Q 28,6 28,14 L 28,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 28,38 L 44,38 Q 48,38 48,44 L 48,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <!-- الـ -->
      <g transform="translate(288, 14)">
        <path d="M 8,52 L 8,14 Q 8,6 18,6 Q 28,6 28,14 L 28,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 36,52 L 36,14 Q 36,6 46,6 Q 56,6 56,14 L 56,52" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      <!-- Baseline connections for Arabic script -->
      <path d="M 28,66 L 334,66" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- BOTTOM GREEN SEPARATOR LINE -->
  <rect x="25" y="93" width="1150" height="4" fill="#84cc16" rx="2"/>
</svg>
