<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Settings Hub - Starter Template</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">

    <script src="../js/core/theme.js"></script>
</head>
<body>

    <header class="px-5 pt-8 pb-6 relative w-full max-w-2xl mx-auto flex items-center justify-between" style="background: var(--c-surface); border-bottom: 1px solid var(--c-border)">
        <a href="../index.html" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-100" style="background: var(--c-surface-2); color: var(--c-text)">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
        <h1 class="text-xl font-black">مركز الإعدادات</h1>
        <div class="w-10"></div> <!-- Spacer for alignment -->
    </header>

    <main class="px-4 py-6 w-full max-w-2xl mx-auto">
        <h3 class="settings-section-title">العام</h3>
        <div class="settings-section">
            <div class="settings-row">
                <div class="settings-row-label">
                    <span class="label-title"><i class="fa-solid fa-user ml-1" style="color:var(--pri)"></i> حسابي</span>
                    <span class="label-desc">إعدادات الملف الشخصي (Placeholder)</span>
                </div>
                <i class="fa-solid fa-chevron-left opacity-50 text-xs"></i>
            </div>
            <a href="system.html" class="settings-row" style="text-decoration: none;">
                <div class="settings-row-label">
                    <span class="label-title"><i class="fa-solid fa-shield-halved ml-1" style="color:var(--pri)"></i> النظام والمظهر</span>
                    <span class="label-desc">الوضع الليلي والألوان</span>
                </div>
                <i class="fa-solid fa-chevron-left opacity-50 text-xs"></i>
            </a>
        </div>

        <h3 class="settings-section-title">البيانات والترخيص</h3>
        <div class="settings-section">
            <a href="backup.html" class="settings-row" style="text-decoration: none;">
                <div class="settings-row-label">
                    <span class="label-title"><i class="fa-solid fa-cloud-arrow-up ml-1" style="color:var(--c-success)"></i> النسخ الاحتياطي</span>
                    <span class="label-desc">مزامنة وحفظ البيانات</span>
                </div>
                <i class="fa-solid fa-chevron-left opacity-50 text-xs"></i>
            </a>
            <a href="license.html" class="settings-row" style="text-decoration: none;">
                <div class="settings-row-label">
                    <span class="label-title"><i class="fa-solid fa-key ml-1" style="color:var(--c-warning)"></i> الترخيص</span>
                    <span class="label-desc">إدارة النسخة وتفعيل التطبيق</span>
                </div>
                <i class="fa-solid fa-chevron-left opacity-50 text-xs"></i>
            </a>
        </div>
        
        <h3 class="settings-section-title" style="color: var(--c-danger)"><i class="fa-solid fa-triangle-exclamation ml-1"></i> منطقة الخطر</h3>
        <div class="danger-zone">
            <button class="btn btn-outline w-full" style="color: var(--c-warning); border-color: rgba(245,158,11,0.3);" onclick="console.log('Not Implemented')">إعادة الافتراضيات</button>
            <button class="btn btn-danger w-full" onclick="console.log('Not Implemented')"><i class="fa-solid fa-trash ml-1"></i> مسح التطبيق كاملاً</button>
        </div>
    </main>

</body>
</html>
