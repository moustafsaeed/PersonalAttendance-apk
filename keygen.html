<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مولّد التراخيص - أداة الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">
    <h1 class="text-2xl font-bold mb-4 text-slate-800 text-center">أداة توليد التراخيص 🔐</h1>
    <p class="text-[11px] text-red-500 mb-6 text-center font-bold">تنبيه: احتفظ بهذا الملف سرياً في حاسوبك الشخصي ولا تشاركه مع أحد</p>
    
    <div class="mb-4">
      <label class="block text-sm font-bold text-slate-700 mb-2">كلمة السر الأساسية (App Secret)</label>
      <input type="text" id="appSecret" value="GLM2026_HARDWARE_SALT_xyz" class="w-full px-3 py-2 border rounded-lg bg-slate-50 text-xs font-mono" readonly>
    </div>
    
    <div class="mb-5">
      <label class="block text-sm font-bold text-slate-700 mb-2">معرّف جهاز العميل (Device ID)</label>
      <input type="text" id="deviceId" placeholder="مثال: abc123def456" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-center font-mono uppercase bg-yellow-50">
    </div>
    
    <button onclick="generateKey()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition transform active:scale-95 shadow-md">توليد مفتاح التفعيل المحمي</button>
    
    <div id="resultBlock" class="mt-6 hidden bg-green-50 p-4 rounded-xl border border-green-200">
      <label class="block text-sm font-bold text-green-800 mb-2 text-center">أرسل مفتاح التفعيل هذا للعميل بناءً على جهازه:</label>
      <div class="flex gap-2">
         <input type="text" id="activationKey" class="w-full px-3 py-2 border border-green-300 rounded-lg font-bold text-center text-green-700 bg-white font-mono text-[11px] tracking-widest leading-none outline-none" readonly>
         <button onclick="copyKey()" class="bg-green-600 hover:bg-green-700 text-white px-4 rounded-lg text-sm font-bold shadow transition"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2Zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6ZM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2Z"/></svg></button>
      </div>
    </div>
  </div>

  <script>
    async function generateKey() {
      let secret = document.getElementById('appSecret').value;
      let devId = document.getElementById('deviceId').value.replace(/\s+/g,'').toUpperCase();
      if(!devId) return alert('يرجى أولاً لصق معرّف الجهاز الذي أرسله العميل إليك!');
      
      try {
        let enc = new TextEncoder();
        let key = await crypto.subtle.importKey(
          'raw', enc.encode(secret), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']
        );
        let signature = await crypto.subtle.sign('HMAC', key, enc.encode(devId));
        
        let hashArray = Array.from(new Uint8Array(signature));
        let hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        // Generate a 32-character structural key: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX
        let finalKey = hashHex.substring(0,8) + '-' + hashHex.substring(8,16) + '-' + hashHex.substring(16,24) + '-' + hashHex.substring(24,32);
        
        document.getElementById('activationKey').value = finalKey;
        document.getElementById('resultBlock').classList.remove('hidden');
      } catch(e) { alert('حصل خطأ في خوارزمية التشفير'); console.error(e); }
    }
    
    function copyKey() {
      let f = document.getElementById('activationKey');
      f.select(); navigator.clipboard.writeText(f.value);
      let btn = event.currentTarget;
      let old = btn.innerHTML;
      btn.innerHTML = 'تم!';
      setTimeout(()=>btn.innerHTML = old, 1500);
    }
  </script>
</body>
</html>
